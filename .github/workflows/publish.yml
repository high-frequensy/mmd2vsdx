name: Publish to PyPI
# Runs when a GitHub release is published. Uses PyPI trusted publishing: no token is stored anywhere.
# One-time setup on pypi.org: Account settings > Publishing > add a pending publisher for project "mmd2vsdx",
# owner high-frequensy, repository mmd2vsdx, workflow publish.yml, environment pypi.
on:
  release:
    types: [published]
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@release/v1
